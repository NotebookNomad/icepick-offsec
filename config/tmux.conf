# Long scans outlive your terminal; tmux is how you keep them.
set -g default-terminal "screen-256color"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# C-b collides with too much; C-a is the pentester default.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

set -g status-style bg=colour234,fg=colour137
set -g status-left "#[fg=colour233,bg=colour241,bold] #h "
set -g status-right "#[fg=colour233,bg=colour241,bold] %H:%M "
